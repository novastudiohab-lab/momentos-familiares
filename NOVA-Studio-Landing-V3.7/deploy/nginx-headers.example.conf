# SOLO REFERENCIA: incluir dentro del bloque server HTTPS que sirve NOVA Studio.
# No pegar dentro de otra location sin comprobar herencia de add_header.
server_tokens off;
autoindex off;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Activar HSTS solo después de probar HTTPS y tus subdominios.
# add_header Strict-Transport-Security "max-age=31536000" always;
